<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon / PWA touch icon — LabelAlly brand mark -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Self-hosted fonts — preload critical latin subsets (body + headings) -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Page title — overridden per-page by react-helmet-async -->
    <title>LabelAlly Entertainment | YouTube Channel Management & Music Rights</title>

    <!-- Meta description — overridden per-page by react-helmet-async -->
    <meta
      name="description"
      content="LabelAlly Entertainment provides YouTube channel management, rights management, monetization support and music distribution management for artists and music labels."
    />

    <!-- Crawl directives + homepage canonical (overridden per-page by react-helmet-async) -->
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.labelally.in/" />

    <!-- Default Open Graph / Twitter fallbacks for non-JS crawlers -->
    <meta property="og:title" content="LabelAlly Entertainment" />
    <meta property="og:description" content="YouTube Channel Management, Rights Management, Monetization and Music Distribution Management for artists and music labels." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.labelally.in/" />
    <meta property="og:site_name" content="LabelAlly" />
    <meta property="og:image" content="https://www.labelally.in/default-og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LabelAlly Entertainment" />
    <meta name="twitter:description" content="YouTube Channel Management, Rights Management, Monetization and Music Distribution Management for artists and music labels." />
    <meta name="twitter:image" content="https://www.labelally.in/default-og.png" />

    <!-- Theme color — matches brand light background; dark set via theme boot -->
    <meta name="theme-color" content="#FCFCFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0F19" media="(prefers-color-scheme: dark)" />

    <!-- Prevent incorrect-theme flash during initial load -->
    <script>
      (function() {
        var savedTheme = null;
        try {
          savedTheme = localStorage.getItem('theme');
        } catch (e) {}

        var systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark;

        if (savedTheme === 'dark') {
          isDark = true;
        } else if (savedTheme === 'light') {
          isDark = false;
        } else {
          isDark = systemPrefersDark;
        }

        var root = document.documentElement;

        if (isDark) {
          root.classList.add('dark');
          root.setAttribute('data-theme', 'dark');
          root.style.colorScheme = 'dark';
        } else {
          root.classList.remove('dark');
          root.setAttribute('data-theme', 'light');
          root.style.colorScheme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
